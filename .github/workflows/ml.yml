# Tests of the Python pipeline (TensorFlow, a few minutes): on changes under ml/ and by hand. Apart from CI, so the
# deploy does not wait for them.
name: ML tests

on:
  workflow_dispatch:
  pull_request:
    paths: ["ml/**"]
  push:
    branches: [develop]
    paths: ["ml/**"]

permissions:
  contents: read

jobs:
  pytest:
    name: Pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Tests
        working-directory: ml
        run: python -m pytest -q tests
