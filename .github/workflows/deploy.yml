# Deploys to the real Firebase project on every push to main (a merged pull request from develop), after the tests.
# Authentication: Workload Identity Federation, no key files. The values are repository variables (Settings →
# Secrets and variables → Actions → Variables); scripts/cloud/setup-gcp.ps1 prints them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  firebase:
    name: Rules, indexes, Functions and Hosting
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node 24 and npm 11, as in development: npm 10 reads the lockfiles differently and rejects them.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Build the web app for the real project
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
          VITE_FUNCTIONS_REGION: ${{ vars.GCP_REGION }}
          VITE_USE_EMULATORS: "false"
        run: npm --prefix web run build

      - name: Parameters of the Functions
        run: |
          printf 'READINGS_MIN_INSTANCES=0\nSIMULATOR_JOB=simulator\n' > "functions/.env.${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy
        run: npx firebase deploy --project "${{ vars.GCP_PROJECT_ID }}" --only firestore,functions,hosting --non-interactive --force

  simulator:
    name: Simulator on Cloud Run Jobs
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/simulator/simulator
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f simulator/Dockerfile -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy the job
        run: |
          gcloud run jobs deploy simulator \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_SIMULATOR_SA }}" \
            --cpu 1 --memory 2Gi --task-timeout 6h --max-retries 0 \
            --set-env-vars "GCLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},SIM_DATA_URI=gs://${{ vars.SIM_DATA_BUCKET }}/sim" \
            --quiet
